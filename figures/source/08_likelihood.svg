<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="white"/>
<text x="28" y="56" font-family="Arial" font-size="42" font-weight="700" fill="#000000">Joint likelihood: combine both read-count signals</text>
<text x="48" y="111" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Shared across loci: π, η</text>
<text x="650" y="111" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Per locus: kᵢ, mᵢ</text>
<text x="48" y="166" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Within each locus</text>
<text x="48" y="226" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Locus 1</text>
<rect x="224" y="190" width="300" height="86" rx="12" fill="white" stroke="#2c3385" stroke-width="1"/>
<text x="245" y="221" font-family="Arial" font-size="23.625" font-weight="700" fill="#2c3385">Poisson</text>
<text x="245" y="255" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">p(d₁ | π, η, k₁)</text>
<text x="552" y="241" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">×</text>
<rect x="602" y="190" width="378" height="86" rx="12" fill="white" stroke="#018f52" stroke-width="1"/>
<text x="624" y="221" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">Conditional Binomial</text>
<text x="624" y="255" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">p(r₁ | d₁, π, k₁, m₁)</text>
<text x="1010" y="241" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">= L₁</text>
<text x="48" y="339" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Locus 2</text>
<rect x="224" y="303" width="300" height="86" rx="12" fill="white" stroke="#2c3385" stroke-width="1"/>
<text x="245" y="334" font-family="Arial" font-size="23.625" font-weight="700" fill="#2c3385">Poisson</text>
<text x="245" y="368" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">p(d₂ | π, η, k₂)</text>
<text x="552" y="354" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">×</text>
<rect x="602" y="303" width="378" height="86" rx="12" fill="white" stroke="#018f52" stroke-width="1"/>
<text x="624" y="334" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">Conditional Binomial</text>
<text x="624" y="368" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">p(r₂ | d₂, π, k₂, m₂)</text>
<text x="1010" y="354" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">= L₂</text>
<text x="48" y="472" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Locus n</text>
<rect x="224" y="436" width="300" height="86" rx="12" fill="white" stroke="#2c3385" stroke-width="1"/>
<text x="245" y="467" font-family="Arial" font-size="23.625" font-weight="700" fill="#2c3385">Poisson</text>
<text x="245" y="501" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">p(dₙ | π, η, kₙ)</text>
<text x="552" y="487" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">×</text>
<rect x="602" y="436" width="378" height="86" rx="12" fill="white" stroke="#018f52" stroke-width="1"/>
<text x="624" y="467" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">Conditional Binomial</text>
<text x="624" y="501" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">p(rₙ | dₙ, π, kₙ, mₙ)</text>
<text x="1010" y="487" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">= Lₙ</text>
<text x="589" y="423" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">⋮</text>
<path d="M600 529 L600 554" fill="none" stroke="#000000" stroke-width="2"/>
<path d="M593 547 L600 554" fill="none" stroke="#000000" stroke-width="2"/>
<path d="M607 547 L600 554" fill="none" stroke="#000000" stroke-width="2"/>
<rect x="224" y="565" width="756" height="83" rx="12" fill="white" stroke="#000000" stroke-width="1"/>
<text x="245" y="599" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Across loci</text>
<text x="453" y="599" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">L = L₁ × L₂ × ··· × Lₙ</text>
<text x="453" y="633" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Lᵢ: likelihood at locus i</text>
</svg>