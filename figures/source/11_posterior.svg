<text x="28" y="56" font-family="Arial" font-size="42" font-weight="700" fill="#000000">Posterior inference: update the whole parameter set</text>
<text x="48" y="113" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">p(Θ | X) ∝ p(Θ) × p(X | Θ)</text>
