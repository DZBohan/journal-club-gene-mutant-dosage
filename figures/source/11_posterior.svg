<text x="48" y="156" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Θ: π, η and all (kᵢ, mᵢ)</text>
<text x="650" y="156" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">X: observed read counts {(dᵢ, rᵢ)}</text>
