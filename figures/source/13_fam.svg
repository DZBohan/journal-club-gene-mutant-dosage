<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<rect width="1200" height="680" fill="white"/>
<text x="28" y="56" font-family="Arial" font-size="42" font-weight="700" fill="#000000">FAM: average ratios weighted by the posterior</text>
<text x="48" y="109" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Fraction of alleles with the mutation (FAM): m/k</text>
<text x="48" y="151" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Posterior mean: E[mᵢ/kᵢ | X] = Σ₍ₖ,ₘ₎ (m/k) P(kᵢ = k, mᵢ = m | X)</text>
<rect x="24" y="186" width="368" height="289" rx="16" fill="white" stroke="black" stroke-width="0.7"/>
<rect x="48" y="211" width="16" height="20" fill="#7ed3f6"/>
<text x="76" y="232" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">A: (2,1)</text>
<path d="M67 278 L126 278" stroke="#9499c0" stroke-width="5" stroke-linecap="round"/>
<rect x="91" y="268" width="12" height="20" fill="#018f52"/>
<text x="88" y="318" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">M</text>
<path d="M158 278 L217 278" stroke="#9499c0" stroke-width="5" stroke-linecap="round"/>
<rect x="182" y="268" width="12" height="20" fill="#2c3385"/>
<text x="179" y="318" font-family="Arial" font-size="23.625" font-weight="700" fill="#2c3385">W</text>
<text x="48" y="359" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Ratio m/k = 1/2</text>
<text x="48" y="397" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Posterior weight = 18.75%</text>
<text x="48" y="445" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">1/2 × 18.75% = 0.09375</text>
<rect x="416" y="186" width="368" height="289" rx="16" fill="white" stroke="black" stroke-width="0.7"/>
<rect x="440" y="211" width="16" height="20" fill="#92c86b"/>
<text x="468" y="232" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">B: (3,2)</text>
<path d="M459 278 L518 278" stroke="#9499c0" stroke-width="5" stroke-linecap="round"/>
<rect x="483" y="268" width="12" height="20" fill="#018f52"/>
<text x="480" y="318" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">M</text>
<path d="M550 278 L609 278" stroke="#9499c0" stroke-width="5" stroke-linecap="round"/>
<rect x="574" y="268" width="12" height="20" fill="#018f52"/>
<text x="571" y="318" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">M</text>
<path d="M641 278 L700 278" stroke="#9499c0" stroke-width="5" stroke-linecap="round"/>
<rect x="665" y="268" width="12" height="20" fill="#2c3385"/>
<text x="662" y="318" font-family="Arial" font-size="23.625" font-weight="700" fill="#2c3385">W</text>
<text x="440" y="359" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Ratio m/k = 2/3</text>
<text x="440" y="397" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Posterior weight = 75%</text>
<text x="440" y="445" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">2/3 × 75% = 0.50000</text>
<rect x="808" y="186" width="368" height="289" rx="16" fill="white" stroke="black" stroke-width="0.7"/>
<rect x="832" y="211" width="16" height="20" fill="#7fc7a5"/>
<text x="860" y="232" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">C: (1,1)</text>
<path d="M851 278 L910 278" stroke="#9499c0" stroke-width="5" stroke-linecap="round"/>
<rect x="875" y="268" width="12" height="20" fill="#018f52"/>
<text x="872" y="318" font-family="Arial" font-size="23.625" font-weight="700" fill="#018f52">M</text>
<text x="832" y="359" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Ratio m/k = 1</text>
<text x="832" y="397" font-family="Arial" font-size="23.625" font-weight="400" fill="#000000">Posterior weight = 6.25%</text>
<text x="832" y="445" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">1 × 6.25% = 0.06250</text>
<rect x="24" y="504" width="1152" height="91" rx="16" fill="white" stroke="black" stroke-width="0.7"/>
<text x="48" y="539" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">Sum the weighted contributions</text>
<text x="48" y="577" font-family="Arial" font-size="23.625" font-weight="700" fill="#000000">0.09375 + 0.50000 + 0.06250 = 0.65625 = 65.625%</text>
<text x="48" y="646" font-family="Arial" font-size="23.625" font-weight="400" fill="#018f52">M: specified mutation</text>
<text x="652" y="646" font-family="Arial" font-size="23.625" font-weight="400" fill="#2c3385">W: no specified mutation</text>
</svg>